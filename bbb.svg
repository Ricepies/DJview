<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Slate to Night Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34495e" />
      <stop offset="100%" stop-color="#111820" />
    </linearGradient>

    <!-- Document Base Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f0f5" />
    </linearGradient>

    <!-- Document Fold Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d0d5dc" />
    </linearGradient>
    
    <!-- Metallic Bezel & Handle Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#aeb6bf" />
      <stop offset="100%" stop-color="#5d6d7e" />
    </linearGradient>

    <!-- macOS 27 Liquid Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>
    
    <!-- Liquid Glass Specular Highlight -->
    <radialGradient id="lensHighlight" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient and Depth Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="35" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base App Icon Canvas -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- The Document Graphic -->
  <g filter="url(#dropShadow)" transform="translate(262, 180)">
    <!-- Main page body -->
    <path d="M 0 0 L 350 0 L 500 150 L 500 660 L 0 660 Z" fill="url(#docGrad)" />
    <!-- Folded corner -->
    <path d="M 350 0 L 350 150 L 500 150 Z" fill="url(#foldGrad)" filter="url(#dropShadow)" />
    
    <!-- DjVu Abstract Content -->
    <!-- Image block placeholder -->
    <rect x="70" y="100" width="220" height="160" fill="#c5ced6" rx="8" />
    <path d="M 70 260 L 120 180 L 180 230 L 230 150 L 290 260 Z" fill="#aeb6bf" />
    
    <!-- Text lines placeholder -->
    <rect x="70" y="320" width="360" height="20" fill="#d0d5dc" rx="10" />
    <rect x="70" y="370" width="320" height="20" fill="#d0d5dc" rx="10" />
    <rect x="70" y="420" width="360" height="20" fill="#d0d5dc" rx="10" />
    <rect x="70" y="470" width="240" height="20" fill="#d0d5dc" rx="10" />
    
    <!-- Base DjVu Label -->
    <text x="70" y="580" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="#5d6d7e" letter-spacing="-2">DjVu</text>
  </g>

  <!-- Liquid Glass Magnifying Lens -->
  <g transform="translate(480, 560)">
    <!-- Handle -->
    <path d="M 125 125 L 280 280" stroke="url(#metalGrad)" stroke-width="50" stroke-linecap="round" filter="url(#heavyShadow)" />
    <path d="M 135 135 L 270 270" stroke="#34495e" stroke-width="12" stroke-linecap="round" stroke-opacity="0.5" />
    
    <!-- Outer Bezel -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="url(#metalGrad)" stroke-width="20" filter="url(#heavyShadow)" />
    
    <clipPath id="lensClip">
      <circle cx="0" cy="0" r="180" />
    </clipPath>
    
    <!-- Refracted Glass Interior -->
    <g clip-path="url(#lensClip)">
      <!-- Glass backdrop tint -->
      <circle cx="0" cy="0" r="180" fill="url(#glassGrad)" />
      
      <!-- Optically Refracted/Zoomed Content -->
      <g transform="scale(1.25) translate(-220, -420)">
        <rect x="70" y="370" width="320" height="20" fill="#34495e" rx="10" />
        <rect x="70" y="420" width="360" height="20" fill="#34495e" rx="10" />
        <rect x="70" y="470" width="240" height="20" fill="#34495e" rx="10" />
        <text x="70" y="580" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="#111820" letter-spacing="-2">DjVu</text>
      </g>
      
      <!-- Specular Highlight for curved surface -->
      <circle cx="-60" cy="-60" r="160" fill="url(#lensHighlight)" />
      
      <!-- Inner bezel reflection -->
      <circle cx="0" cy="0" r="178" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.5" />
    </g>
  </g>
</svg>
