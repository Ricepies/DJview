[package]
name = "djvu-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
djvu-rs = { version = "0.27.0", features = ["std", "pdf", "image", "serde"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
